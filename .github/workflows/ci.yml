name: TrustForge CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Backend Tests & Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        cd sova/backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest
        
    - name: Run Backend Tests
      run: |
        cd sova/backend
        # Note: golden tests requiring Ollama models will fail or skip without models
        # But unit tests will pass
        pytest tests/test_unit.py
        
    - name: Secret Scan
      uses: zricethezav/gitleaks-action@v2

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'sova/frontend/package-lock.json'

    - name: Install frontend dependencies
      run: |
        cd sova/frontend
        npm ci

    - name: Build frontend
      run: |
        cd sova/frontend
        npm run build
